<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bon podarunkowy · EYE C U</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    html, body { margin:0; padding:0; height:100%; background:#f4f1ec;
      font-family:'Jost', -apple-system, Segoe UI, Arial, sans-serif; }
    iframe { width:100%; height:100vh; height:100dvh; border:0; display:block; }
    .msg { max-width:460px; margin:18vh auto 0; padding:0 24px; text-align:center; }
    .msg h1 { font-family:Georgia, 'Cormorant Garamond', serif; font-weight:500;
      font-size:22px; color:#6B1E2E; margin:0 0 10px; }
    .msg p { color:#767676; font-size:14px; line-height:1.6; }
    .msg a { color:#6B1E2E; text-decoration:none; }
  </style>
</head>
<body>
  <script>
    // Page vitrine : affiche le bon (Web App Apps Script) dans une iframe,
    // sous le domaine irisphoto.eye-c-u.eu — l'URL script.google n'est jamais visible.
    var EXEC = "https://script.google.com/macros/s/AKfycbz2GSv4btOPkcWipqYbn3-K1O6xSzVY32tsuDon0Jsq7AdF-FmcRb--YobLpVFqTJUw/exec";
    var code = new URLSearchParams(location.search).get("code");

    if (code && /^[A-Za-z0-9-]{4,40}$/.test(code)) {
      var ifr = document.createElement("iframe");
      ifr.src = EXEC + "?code=" + encodeURIComponent(code);
      ifr.setAttribute("title", "Bon podarunkowy EYE C U");
      document.body.appendChild(ifr);
    } else {
      document.body.innerHTML =
        '<div class="msg"><h1>Bon podarunkowy EYE C U</h1>' +
        '<p>Link jest niekompletny. Sprawdź link otrzymany w e-mailu ' +
        'lub napisz do nas: <a href="mailto:poznan@eyecu-irisphoto.com">poznan@eyecu-irisphoto.com</a>.</p></div>';
    }
  </script>
</body>
</html>
